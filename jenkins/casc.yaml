# Jenkins configuration as code. Secrets come from environment variables
# (jenkins/.env, never committed).
jenkins:
  systemMessage: "KilosTravel CI/CD - shared Jenkins (Kais, Nesrine, Amine)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "kais"
          name: "Kais Oueriemmi"
          password: "${KAIS_PASSWORD}"
        - id: "nesrine"
          name: "Nesrine Bousrih"
          password: "${NESRINE_PASSWORD}"
        - id: "amine"
          name: "Mohamed Amine Bougueddima"
          password: "${AMINE_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-creds"
              description: "GitHub read-only token (private repo)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              description: "Docker Hub access token"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL:-http://localhost:8080/}"
    adminAddress: "jenkins@kilostravel.local"
  mailer:
    smtpHost: "mailpit"
    smtpPort: "1025"
  email-ext:
    mailAccount:
      smtpHost: "mailpit"
      smtpPort: "1025"
    defaultSuffix: "@kilostravel.local"

jobs:
  - script: >
      pipelineJob('kilostravel-pipeline') {
        description('Pipeline script from SCM: Jenkinsfile read from GitHub')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/Kaisoueriemmi/CICD-JENKINS-KILOS-TRAVEL.git')
                  credentials('github-creds')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
